[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wakegate"
version = "0.1.0"
description = "Cron-first gate that wakes an AI agent only when a cheap signal fires."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "zlephir42069"}]
keywords = ["agents", "automation", "cron", "webhook"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]
dependencies = ["PyYAML>=5.4"]

[project.urls]
Homepage = "https://github.com/zlephir42069/zlegbot-wakegate"

[project.scripts]
wakegate = "wakegate.cli:main"

[tool.setuptools.packages.find]
include = ["wakegate*"]
